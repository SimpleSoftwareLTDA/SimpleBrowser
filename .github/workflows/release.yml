name: Release
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.1.0)'
        required: true
      prerelease:
        description: 'Release type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${RUNNER_TEMP}/android-sdk"
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          mkdir -p "${ANDROID_HOME}/cmdline-tools/latest"
          curl -fsSL -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o clt.zip -d "${ANDROID_HOME}/cmdline-tools"
          mv "${ANDROID_HOME}/cmdline-tools/cmdline-tools/"* "${ANDROID_HOME}/cmdline-tools/latest/"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" >/dev/null
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore_ge.jks

      - name: Build (WebView only)
        run: ./gradlew assembleGenericGeckoExcludedRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore_ge.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename artifact
        run: |
          for f in app/build/outputs/apk/generic/release/app-*.apk; do
            new="${f/app-/simple-browser-${{ inputs.version }}-}"
            mv "$f" "${new/-release.apk/.apk}"
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ inputs.prerelease == 'pre-release' }}
          files: |
            app/build/outputs/apk/generic/release/*.apk

      - name: Sync latest_version.json
        shell: bash
        run: |
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          python3 - "$VERSION_CODE" "$VERSION_NAME" "${{ inputs.version }}" <<'EOF'
          import json, sys
          code, name, ver = sys.argv[1], sys.argv[2], sys.argv[3]
          data = {
              "channels": [{
                  "name": "release",
                  "latestVersionCode": int(code),
                  "latestVersionName": name,
                  "minAPI": 24,
                  "url": f"https://github.com/SimpleSoftwareLTDA/SimpleBrowser/releases/download/v{ver}/simple-browser-{ver}-generic.apk",
              }],
              "changelog": [{
                  "versionCode": int(code),
                  "versionName": name,
                  "changes": f"Simple Browser {name}.",
              }],
          }
          with open("latest_version.json", "w") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          EOF
          git add latest_version.json
          if ! git diff --cached --quiet; then
            git -c user.name="Simple Software" -c user.email="dev@simplesoftware.br" commit -q -m "Update latest_version.json for v${{ inputs.version }}"
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
            git push -q
          fi
